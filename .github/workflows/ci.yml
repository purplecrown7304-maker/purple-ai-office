name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start isolated local Supabase
        run: pnpm exec supabase start -x studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor
      - name: Rebuild only the local CI database
        run: pnpm exec supabase db reset --local
      - name: Test real PostgreSQL, Auth schema, roles and RLS
        run: pnpm test:db
        env:
          OFFICE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          OFFICE_TEST_DISPOSABLE: '1'
      - name: Test real Auth cookies and HTTP workflow
        run: node scripts/test-http.mjs
        env:
          OFFICE_TEST_DISPOSABLE: '1'
      - name: Test Supabase catalog grants with pgTAP
        run: pnpm db:test:local
      - name: Stop local stack
        if: always()
        run: pnpm exec supabase stop
